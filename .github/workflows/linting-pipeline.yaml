name: Linting Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Linting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run HTML Lint
        run: npx htmlhint "src/**/*.html" --config .htmlhintrc.json

      - name: Run CSS Lint
        run: npx stylelint "styles/**/*.css" --config .stylelintrc.json --allow-empty-input
